# PaidScout — daily run on GitHub Actions (example)
#
# Copy this file to .github/workflows/paidscout-daily.yml in your OWN fork.
# Recommendation: use a PRIVATE fork — the workflow commits the SQLite
# history (data/) and daily reports (reports/) back to the repo, and your
# accumulated time series is the valuable part; keep it yours.
#
# The engine exits non-zero when data is incomplete (2 = completeness gate,
# nothing was written; 1 = partial failures), so a broken day fails the run
# loudly instead of silently poisoning the baseline.

name: PaidScout daily

on:
  schedule:
    - cron: "40 1 * * *"   # 01:40 UTC ≈ 09:40 Asia/Shanghai; adjust to taste
  workflow_dispatch: {}     # allow manual runs

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PaidScout
        run: python3 paidscout.py

      - name: Commit history and report
        run: |
          git config user.name "paidscout-bot"
          git config user.email "actions@github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F)"
          git push
