<text x="70" y="96" font-size="17" letter-spacing="4" fill="#2DD4BF">FOR INDIE DEVELOPERS</text>
<text x="66" y="212" font-size="104" font-weight="bold" fill="#FFFFFF">Paid<tspan fill="#F5A524">Scout</tspan></text>
<text x="70" y="272" font-size="31" fill="#E8F1FF">App Store Paid &amp; Offline App Research Engine</text>
<text x="70" y="318" font-size="24" fill="#9DB8D9">给独立开发者的付费离线应用调研引擎</text>
<text x="70" y="392" font-size="21" fill="#C7D8F2">Built to watch the paid charts daily. Track rating velocity,</text>
<text x="70" y="424" font-size="21" fill="#C7D8F2">rank moves and keyword positions — skip the estimates, read the signals.</text>
<text x="70" y="470" font-size="21" fill="#C7D8F2">为每日盯榜而建，看名次、评分量增速与关键词，不编造下载和收入。</text>
</g>
